<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="favMascotGrad" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#ff655a" />
      <stop offset="45%" stop-color="#ff3326" />
      <stop offset="90%" stop-color="#d41e12" />
      <stop offset="100%" stop-color="#990f06" />
    </radialGradient>
    <filter id="favShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#favShadow)">
    <!-- Fluffy top ear lobes / crests -->
    <circle cx="32" cy="36" r="26" fill="url(#favMascotGrad)" />
    <circle cx="68" cy="36" r="26" fill="url(#favMascotGrad)" />
    <circle cx="50" cy="46" r="24" fill="url(#favMascotGrad)" />
    <!-- Lower body -->
    <ellipse cx="50" cy="62" rx="36" ry="30" fill="url(#favMascotGrad)" />

    <!-- White pill eyes -->
    <rect x="36" y="42" width="12" height="24" rx="6" fill="#ffffff" />
    <rect x="52" y="42" width="12" height="24" rx="6" fill="#ffffff" />

    <!-- Dark pupils looking up/right -->
    <rect x="40" y="46" width="7" height="13" rx="3.5" fill="#121214" />
    <rect x="56" y="46" width="7" height="13" rx="3.5" fill="#121214" />

    <!-- White catchlights in eyes -->
    <circle cx="42" cy="49" r="2" fill="#ffffff" />
    <circle cx="58" cy="49" r="2" fill="#ffffff" />
  </g>
</svg>
